[build]
  base = "client"
  command = "npm install --legacy-peer-deps && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Set VITE_API_URL in Netlify UI (Site settings → Environment variables)
  # to your Render backend URL, e.g. https://portfolio-api.onrender.com
  # Then trigger "Clear cache and deploy site" so Vite picks it up at build time.

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
